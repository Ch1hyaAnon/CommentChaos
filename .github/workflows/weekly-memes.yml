name: Weekly meme review candidates
on:
  schedule:
    - cron: '15 1 * * 1' # Monday 09:15 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect unapproved candidates
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/update-memes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meme-review-candidates
          path: artifacts/memes/
          retention-days: 30
          if-no-files-found: warn
